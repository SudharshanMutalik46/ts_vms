syntax = "proto3";

package vms.ai;

// ============================================================================
// VMS AI Engine gRPC Contract
// ============================================================================
//
// DESIGN PRINCIPLES (CONTRACT FREEZE PHASE 5.1):
// 1. STABILITY: This contract is stable and must evolve additively.
// 2. COMPATIBILITY: Never reuse field numbers. Always reserve removed fields.
// 3. FLEXIBILITY: metadata_json is intentionally flexible to allow model
//    evolution without breaking the proto contract.
// 4. TIME: event_time_ms represents the time of occurrence, NOT ingestion time.
// 5. IDENTIFIERS: event_id must be a UUID string.
//
// ============================================================================

// Stream role definition
// MUST include UNSPECIFIED = 0 to avoid accidental defaults
enum StreamRole {
  STREAM_ROLE_UNSPECIFIED = 0;
  MAIN = 1;
  SUB = 2;
}

// ============================================================================
// Service Definition
// ============================================================================

service AiEngine {
  // Register a camera stream for AI processing
  rpc RegisterStream(RegisterStreamRequest) returns (RegisterStreamResponse);

  // Configure AI features for a specific camera
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);

  // Stream AI events (Server-side streaming)
  // AI Engine pushes events to the control plane
  rpc StreamEvents(StreamEventsRequest) returns (stream AiEvent);
}

// ============================================================================
// Request/Response Messages
// ============================================================================

message RegisterStreamRequest {
  string camera_id = 1;
  string rtsp_url = 2;
  StreamRole role = 3;
}

message RegisterStreamResponse {
  bool ok = 1;
  string message = 2;
}

message ConfigureRequest {
  string camera_id = 1;
  string feature_code = 2;  // e.g., "PERSON_DETECTION", "LPR". String for extensibility.
  string config_json = 3;   // Opaque JSON configuration interpreted by AI Engine
  bool enabled = 4;
}

message ConfigureResponse {
  bool ok = 1;
  string message = 2;
}

message StreamEventsRequest {
  repeated string camera_ids = 1; // Optional filter; empty = all cameras
  int64 start_time_ms = 2;        // Optional hint for resume/replay (0 = real-time)
}

// Core Event Message
message AiEvent {
  // Required Core Fields
  string event_id = 1;       // UUID string generated by AI Engine
  string camera_id = 2;      // Associated camera ID
  string event_type = 3;     // e.g., "PERSON_DETECTED", "MOTION", "VEHICLE_DETECTED"
  float confidence = 4;      // 0.0 to 1.0
  int64 event_time_ms = 5;   // Epoch timestamp (ms) when event occurred
  string metadata_json = 6;  // JSON payload (bboxes, labels, track_ids, etc.)

  // Optional Context Fields
  string model_id = 7;       // ID/Name of the model that generated this event
  int64 frame_time_ms = 8;   // Timestamp of the video frame source
  StreamRole role = 9;       // Stream source (MAIN/SUB) where inference ran

  // Forward Compatibility / Reserved Ranges
  // Message-scoped reservations provided to ensure future standard fields
  // and vendor extensions do not conflict.
  reserved 100 to 199; // Reserved for future standard fields
  reserved 200 to 299; // Reserved for vendor extensions
}
